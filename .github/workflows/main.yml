
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'downloadfile-1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q downloadfile-1.zip -d project
          find project -name settings.gradle -print

      - name: Build APK
        run: |
          cd project/ElektronAndroidProject
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elektron-debug-APK
          path: project/ElektronAndroidProject/app/build/outputs/apk/debug/app-debug.apk
